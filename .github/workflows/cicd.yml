name: CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A release updates shared branches and a single server, so do not run two
# releases for the same ref at once. Running jobs are intentionally not cancelled.
concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    env:
      MONGODB_INTEGRATION_URI: mongodb://127.0.0.1:27017/tictactoe_ci

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit and integration tests
        run: npm run test:all

  promote:
    name: Promote tested revision to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to the tested revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/main"

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
      DEPLOY_DIRECTORY: /home/ubuntu/tech611-ttt-cicd
      PM2_APP_NAME: ttt-app

    steps:
      - name: Check required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is not configured"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key.pem"
          chmod 600 "$RUNNER_TEMP/ec2_key.pem"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check out the promoted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create deployment directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ec2_key.pem" \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p '$DEPLOY_DIRECTORY'"

      - name: Copy application to EC2
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          rsync --archive --compress \
            --exclude node_modules \
            -e "ssh -i $RUNNER_TEMP/ec2_key.pem" \
            ./ "$EC2_USERNAME@$EC2_HOST:$DEPLOY_DIRECTORY/"

      - name: Install dependencies and restart application
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ec2_key.pem" \
            "$EC2_USERNAME@$EC2_HOST" \
            "cd '$DEPLOY_DIRECTORY' && npm ci --omit=dev --ignore-scripts && \
            (pm2 restart '$PM2_APP_NAME' --update-env || pm2 start npm --name '$PM2_APP_NAME' -- start) && \
            pm2 save"

      - name: Verify deployed application
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ec2_key.pem" \
            "$EC2_USERNAME@$EC2_HOST" \
            "curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:3000/ >/dev/null"

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ec2_key.pem" "$HOME/.ssh/known_hosts"
